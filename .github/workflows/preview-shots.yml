# Manual: build the site, run it, take real-browser screenshots (home + map,
# with live map tiles) and push them to the `ci-shots` branch for review.
name: Preview screenshots

on:
  workflow_dispatch:
    inputs:
      only:
        description: 'Only these sweep pages (comma separated, e.g. activity-batur,activity-spa). Empty = all.'
        required: false
        default: ''

permissions:
  contents: write

env:
  NODE_VERSION: '22'

jobs:
  shots:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: bali
          POSTGRES_PASSWORD: bali
          POSTGRES_DB: bali
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U bali"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://bali:bali@localhost:5433/bali
      BETTER_AUTH_SECRET: ci-build-placeholder-secret-0123456789abcdef
      BETTER_AUTH_URL: http://localhost:3000
      NEXT_PUBLIC_SITE_URL: http://localhost:3000
      # Shots of My Trip and checkout with something in the trip (CI only).
      ALLOW_BOOKINGS: 'true'
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm db:migrate
      - run: pnpm db:seed
      # One activity marked unavailable, for the «notify me» panel shot.
      - name: Mark one activity unavailable
        run: psql "$DATABASE_URL" -c "update activities set status = 'unavailable', slug = 'ci-unavailable-activity' where id = (select id from activities where slug not in ('mount-batur-sunrise-hike', 'ubud-jungle-spa-ritual') order by sort_order desc limit 1)"
      # A7: four look-alike activities, then the merge from migration 0027 run
      # on them, for the merged-activity shot and its old-link redirect.
      - name: Merge fixture (migration 0027 on four water-sports copies)
        run: |
          {
            echo "create temp table f (like activities);"
            echo "insert into f select * from activities where slug = 'blue-lagoon-snorkeling';"
            for row in "a|Water Sports Package A|4500" "b|Water Sports Package B|5500" "c|Water Sports Package C (with Sea Walker)|7500" "premium|Water Sports Premium VIP Package|9900"; do
              IFS='|' read -r key name price <<< "$row"
              echo "update f set id = gen_random_uuid(), legacy_id = null, slug = 'water-sports-package-$key', name = jsonb_build_object('en', '$name', 'ar', '$name', 'id', '$name'), price_minor = $price;"
              echo "insert into activities select * from f;"
              echo "insert into activity_categories select (select id from activities where slug = 'water-sports-package-$key'), category_id from activity_categories where activity_id = (select id from activities where slug = 'blue-lagoon-snorkeling');"
            done
            awk '/^CREATE OR REPLACE FUNCTION pg_temp.bt_merge_activities/,/^END \$\$;$/' drizzle/0028_activities_list_cleanup.sql
            awk '/^SELECT pg_temp.bt_merge_activities\($/{p=1} p{print} /^\);$/{if(p){exit}}' drizzle/0028_activities_list_cleanup.sql
          } > merge-fixture.sql
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f merge-fixture.sql
          psql "$DATABASE_URL" -c "select slug, status, merged_into_id is not null as merged from activities where slug like 'water-sports%' order by slug" -c "select key, name->>'en' as name, price_minor from activity_tiers where activity_id = (select id from activities where slug = 'water-sports-bali') order by sort_order"
      # Real photos of the seeded places (Wikimedia Commons, see the manifest),
      # so the shots show what production shows. Not fatal if Commons is slow.
      - name: Import place photos
        run: pnpm exec tsx scripts/import-photos.ts --only=map_places,activities
        continue-on-error: true
        timeout-minutes: 8
      # Activity page v2: a demo activity shaped like the client's reference
      # design (sample prices from the image, CI only — never on live).
      - name: Activity v2 demo fixture
        run: psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f scripts/ci-activity-v2-fixture.sql
      - run: pnpm build
      - run: pnpm exec playwright install --with-deps chromium
      - name: Start the site
        run: |
          cp -r public .next/standalone/ && cp -r .next/static .next/standalone/.next/
          (cd .next/standalone && PORT=3000 HOSTNAME=0.0.0.0 node server.js > ../../server.log 2>&1 &)
          for i in $(seq 1 60); do curl -fsS http://localhost:3000/api/health >/dev/null 2>&1 && break; sleep 2; done
      - name: Screenshots
        run: node scripts/ci-shots.mjs
        env:
          SHOTS_ONLY: ${{ inputs.only }}
      - name: Push screenshots to the ci-shots branch
        if: always()
        run: |
          cp server.log ci-shots/server.log 2>/dev/null || true
          cd ci-shots
          git init -q
          git config user.name "ci-shots"
          git config user.email "ci-shots@users.noreply.github.com"
          git checkout -q -b ci-shots
          git add -A
          git commit -q -m "Screenshots for ${GITHUB_SHA}"
          git push -q -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${GITHUB_REPOSITORY}.git" ci-shots

  # C2: the whole purchase path in the sandbox payment mode (the stand-in for
  # Stripe test mode): itinerary → pay → PDF download; activity package and
  # package → pay → confirmation. Playwright, desktop and phone.
  purchase:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: bali
          POSTGRES_PASSWORD: bali
          POSTGRES_DB: bali
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U bali"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      gotenberg:
        image: gotenberg/gotenberg:8
        ports:
          - 3100:3000
    env:
      DATABASE_URL: postgresql://bali:bali@localhost:5433/bali
      BETTER_AUTH_SECRET: ci-build-placeholder-secret-0123456789abcdef
      BETTER_AUTH_URL: http://localhost:3000
      NEXT_PUBLIC_SITE_URL: http://localhost:3000
      ALLOW_BOOKINGS: 'true'
      PAYMENT_PROVIDER: sandbox
      ALLOW_SANDBOX_PAYMENTS: 'true'
      PAYMENT_WEBHOOK_SECRET: ci-webhook-secret
      GOTENBERG_URL: http://localhost:3100
      PRIVATE_STORAGE_DIR: ${{ github.workspace }}/private-files
      E2E_BASE_URL: http://localhost:3000
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm db:migrate
      - run: pnpm db:seed
      - run: pnpm exec tsx scripts/seed-tiers.ts
      - run: mkdir -p "$PRIVATE_STORAGE_DIR"
      - name: Render itinerary PDFs
        run: pnpm exec tsx scripts/render-itinerary-pdfs.ts
      - run: pnpm build
      - run: pnpm exec playwright install --with-deps chromium
      - name: Start the site
        run: |
          cp -r public .next/standalone/ && cp -r .next/static .next/standalone/.next/
          (cd .next/standalone && PORT=3000 HOSTNAME=0.0.0.0 node server.js > ../../server.log 2>&1 &)
          for i in $(seq 1 60); do curl -fsS http://localhost:3000/api/health >/dev/null 2>&1 && break; sleep 2; done
      - name: Purchase path (Playwright)
        run: |
          set -o pipefail
          pnpm exec playwright test e2e/purchase.spec.ts --reporter=github,list 2>&1 | tee playwright.log
      - name: Push results to the purchase-check branch
        if: always()
        run: |
          mkdir -p purchase-check
          cp -r test-results purchase-check/ 2>/dev/null || true
          cp server.log playwright.log purchase-check/ 2>/dev/null || true
          cd purchase-check
          git init -q
          git config user.name "purchase-check"
          git config user.email "purchase-check@users.noreply.github.com"
          git checkout -q -b purchase-check
          git add -A
          git commit -q -m "Purchase check for ${GITHUB_SHA}" --allow-empty
          git push -q -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${GITHUB_REPOSITORY}.git" purchase-check
