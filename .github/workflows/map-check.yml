# Map v2 end-to-end check: the three-step flow, paywall, deep links and the
# back button on desktop and phone (e2e/full/public-map.spec.ts) against a
# seeded CI copy. Results go to the `map-check` branch.
name: Map check

on:
  push:
    branches: [feat/map-v2]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: map-check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: bali
          POSTGRES_PASSWORD: bali
          POSTGRES_DB: bali
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U bali"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://bali:bali@localhost:5433/bali
      BETTER_AUTH_SECRET: ci-build-placeholder-secret-0123456789abcdef
      BETTER_AUTH_URL: http://localhost:3000
      NEXT_PUBLIC_SITE_URL: http://localhost:3000
      E2E_BASE_URL: http://localhost:3000
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm db:migrate
      - run: pnpm db:seed
      - name: Migration 0038 is idempotent
        run: |
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f drizzle/0038_map_category_style.sql
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f drizzle/0038_map_category_style.sql
          psql "$DATABASE_URL" -c "select key, map_tier, icon, map_color from categories where map_tier is not null order by map_order"
      - run: pnpm exec tsx scripts/seed-tiers.ts
      # The seed's free places sit in two or three types; move three of them
      # into other free types so the «fourth type» hint can be exercised.
      - name: Fixture (free places in more free types)
        run: |
          for key in malls hospital markets; do
            psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -c "update map_places set category_id = (select id from categories where key = '$key') where id = (select mp.id from map_places mp join categories c on c.id = mp.category_id where mp.is_free and c.key not in ('malls','hospital','markets') and mp.deleted_at is null order by mp.slug limit 1)"
          done
      - run: pnpm build
      - run: pnpm exec playwright install --with-deps chromium
      - name: Start the site
        run: |
          cp -r public .next/standalone/ && cp -r .next/static .next/standalone/.next/
          (cd .next/standalone && PORT=3000 HOSTNAME=0.0.0.0 node server.js > ../../server.log 2>&1 &)
          for i in $(seq 1 60); do curl -fsS http://localhost:3000/api/health >/dev/null 2>&1 && break; sleep 2; done
      - name: Map v2 (Playwright, desktop + phone)
        run: |
          set -o pipefail
          mkdir -p full-test-out
          pnpm exec playwright test -c e2e/full/playwright.full.config.ts public-map 2>&1 | tee full-test-out/playwright.log
      - name: Push results to the map-check branch
        if: always()
        run: |
          mkdir -p map-check
          cp -r full-test-out map-check/ 2>/dev/null || true
          tail -300 server.log > map-check/server-tail.log 2>/dev/null || true
          cd map-check
          git init -q
          git config user.name "map-check"
          git config user.email "map-check@users.noreply.github.com"
          git checkout -q -b map-check
          git add -A
          git commit -q -m "Map check for ${GITHUB_SHA}" --allow-empty
          git push -q -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${GITHUB_REPOSITORY}.git" map-check
