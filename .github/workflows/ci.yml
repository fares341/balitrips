name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: '22'

jobs:
  verify:
    name: Typecheck, lint, test
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: bali
          POSTGRES_PASSWORD: bali
          POSTGRES_DB: bali_test
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U bali"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Format check
        # informational: local formatter versions differ slightly
        continue-on-error: true
        run: pnpm format:check

      - name: Typecheck
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint

      - name: Unit + integration tests
        run: pnpm test
        env:
          DATABASE_URL: postgresql://bali:bali@localhost:5433/bali_test

  build:
    name: Build
    runs-on: ubuntu-latest
    needs: verify

    # `next build` prerenders every content page, so generateStaticParams
    # queries the database at build time. A build without a populated
    # database does not merely warn — it fails. That is the correct
    # trade-off (a silently empty site would be worse), but it means CI has
    # to migrate and seed before building.
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: bali
          POSTGRES_PASSWORD: bali
          POSTGRES_DB: bali
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U bali"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgresql://bali:bali@localhost:5433/bali
      # build-only placeholders (no real secrets in CI)
      BETTER_AUTH_SECRET: ci-build-placeholder-secret-0123456789abcdef
      BETTER_AUTH_URL: http://localhost:3000
      NEXT_PUBLIC_SITE_URL: http://localhost:3000

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Migrate
        run: pnpm db:migrate

      - name: Seed content
        run: pnpm db:seed

      # Builds run here and never on the droplet: `next build` peaks at
      # 1.5-3 GB, and on the 4 GiB box the OOM killer takes Postgres rather
      # than Node — a deploy would become a database outage.
      - name: Build
        shell: bash
        run: |
          set -o pipefail
          pnpm build 2>&1 | tee build.log

      - name: Report build errors
        if: failure()
        shell: bash
        run: |
          # surface the failure as annotations (readable from the API/UI summary)
          grep -nE "Error|error|Failed|failed|Cannot|cannot|not found|Type " build.log | tail -40 | while IFS= read -r line; do
            echo "::error::${line:0:900}"
          done
          tail -25 build.log | while IFS= read -r line; do echo "::warning::${line:0:900}"; done

      # Same command the server runs (deploy/start-production.sh): the image
      # build prerenders pages, so it reaches the CI Postgres via the host network.
      - name: Build production image (as on the server)
        shell: bash
        run: |
          set -o pipefail
          DOCKER_BUILDKIT=1 docker build --network host --target runner -t bali-app:ci \
            --build-arg "DATABASE_URL=$DATABASE_URL" \
            --build-arg "NEXT_PUBLIC_SITE_URL=http://localhost:3000" . 2>&1 | tee docker-build.log

      - name: Report image build errors
        if: failure()
        shell: bash
        run: |
          [ -f docker-build.log ] || exit 0
          grep -nE "Error|error|Failed|failed|Cannot|not found" docker-build.log | tail -40 | while IFS= read -r line; do
            echo "::error::${line:0:900}"
          done
