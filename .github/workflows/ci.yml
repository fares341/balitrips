name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: '22'

jobs:
  verify:
    name: Typecheck, lint, test
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: bali
          POSTGRES_PASSWORD: bali
          POSTGRES_DB: bali_test
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U bali"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Format check
        run: pnpm format:check

      - name: Typecheck
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint

      - name: Unit + integration tests
        run: pnpm test
        env:
          DATABASE_URL: postgresql://bali:bali@localhost:5433/bali_test

  build:
    name: Build
    runs-on: ubuntu-latest
    needs: verify

    # `next build` prerenders every content page, so generateStaticParams
    # queries the database at build time. A build without a populated
    # database does not merely warn — it fails. That is the correct
    # trade-off (a silently empty site would be worse), but it means CI has
    # to migrate and seed before building.
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: bali
          POSTGRES_PASSWORD: bali
          POSTGRES_DB: bali
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U bali"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgresql://bali:bali@localhost:5433/bali

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Migrate
        run: pnpm db:migrate

      - name: Seed content
        run: pnpm db:seed

      # Builds run here and never on the droplet: `next build` peaks at
      # 1.5-3 GB, and on the 4 GiB box the OOM killer takes Postgres rather
      # than Node — a deploy would become a database outage.
      - name: Build
        run: pnpm build

      - uses: docker/setup-buildx-action@v3

      - name: Build production image
        uses: docker/build-push-action@v6
        with:
          context: .
          target: runner
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
