# Manual: build the site with a custom ADMIN_BASE_PATH (as production does),
# create the test accounts, sign in as each staff role through the real
# sign-in page + TOTP, and open every Studio page at 1440 and 390.
# Results (summary.txt, results.json, log.txt, server.log, screenshots) are
# pushed to the `admin-check` branch. No photo import, so it is quick.
name: Studio check

on:
  workflow_dispatch:
    inputs:
      admin_path:
        description: ADMIN_BASE_PATH used for build and run
        default: /studio-ci7

permissions:
  contents: write

jobs:
  studio:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: bali
          POSTGRES_PASSWORD: bali
          POSTGRES_DB: bali
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U bali"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://bali:bali@localhost:5433/bali
      BETTER_AUTH_SECRET: ci-build-placeholder-secret-0123456789abcdef
      BETTER_AUTH_URL: http://localhost:3000
      NEXT_PUBLIC_SITE_URL: http://localhost:3000
      ADMIN_BASE_PATH: ${{ inputs.admin_path }}
      TEST_ACCOUNT_DOMAIN: test.balitrips.local
      TEST_ACCOUNT_PASSWORD: Ci-Studio-Check-2026
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: mkdir -p admin-check
      - run: pnpm db:migrate
      - run: pnpm db:seed
      - name: Build
        shell: bash
        run: |
          set -o pipefail
          pnpm build 2>&1 | tee admin-check/build.log
      - name: Create test accounts
        # The output holds the TOTP secrets: kept out of the results folder.
        run: pnpm exec tsx scripts/create-test-accounts.ts > "$RUNNER_TEMP/accounts.txt" 2>&1 || (tail -5 "$RUNNER_TEMP/accounts.txt" | sed 's/^/::error::/'; exit 1)
      - run: pnpm exec playwright install --with-deps chromium
      - name: Start the site
        run: |
          cp -r public .next/standalone/ && cp -r .next/static .next/standalone/.next/
          (cd .next/standalone && PORT=3000 HOSTNAME=0.0.0.0 node server.js > ../../server.log 2>&1 &)
          for i in $(seq 1 60); do curl -fsS http://localhost:3000/api/health >/dev/null 2>&1 && break; sleep 2; done
      - name: Studio pages
        env:
          ACCOUNTS_FILE: ${{ runner.temp }}/accounts.txt
          SERVER_LOG: server.log
        run: node scripts/admin-check.mjs
      - name: Push results to the admin-check branch
        if: always()
        run: |
          cp server.log admin-check/server.log 2>/dev/null || true
          cd admin-check
          git init -q
          git config user.name "admin-check"
          git config user.email "admin-check@users.noreply.github.com"
          git checkout -q -b admin-check
          git add -A
          git commit -q -m "Studio check for ${GITHUB_SHA}"
          git push -q -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${GITHUB_REPOSITORY}.git" admin-check
