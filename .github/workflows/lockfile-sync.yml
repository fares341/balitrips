# Branch helper: when package.json changed without pnpm-lock.yaml (the dev
# box has no registry), resolve the lockfile here and commit it back.
name: Lockfile sync

on:
  push:
    branches: [fix/activity-new-save]
    paths: [package.json]

permissions:
  contents: write

jobs:
  lock:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: pnpm install --lockfile-only --no-frozen-lockfile
      - name: Commit lockfile
        run: |
          if git diff --quiet pnpm-lock.yaml; then echo "lockfile in sync"; exit 0; fi
          git config user.name "lockfile-sync"
          git config user.email "lockfile-sync@users.noreply.github.com"
          git add pnpm-lock.yaml
          git commit -m "chore: sync pnpm-lock.yaml"
          git push origin HEAD:${GITHUB_REF_NAME}
