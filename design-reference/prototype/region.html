<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Bali Trips — تفاصيل المنطقة</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800&family=Tajawal:wght@400;500;700&display=swap">
<link rel="stylesheet" href="assets/bt.css">
<style>
.facts3 { display: grid; gap: 10px; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); }
.facts3 div { padding: 16px; border-radius: 16px; background: var(--white); border: 1px solid var(--line-soft); display: flex; flex-direction: column; gap: 4px; }
.facts3 b { color: var(--forest); }
.rmap { position: relative; height: 320px; border-radius: 24px; overflow: hidden; background: #0b2f45; display: block; }
.rmap img { position: absolute; max-width: none; }
.rmap .pt { position: absolute; width: 14px; height: 14px; margin: -7px; border-radius: 50%; background: #fff; border: 3px solid var(--orange); }
.rmap .btn { position: absolute; bottom: 14px; inset-inline-start: 14px; }
</style>
</head>
<body data-page="region" data-section="explore">
<div id="hdr"></div>
<main id="main"><div id="root"></div></main>
<div id="ftr"></div>
<script src="assets/data.js"></script>
<script src="assets/bt.js"></script>
<script>
BT.boot();
(function () {
const { D, t, L, icon, img, mount } = BT;
const r = BT.region(BT.hashId()); const root = document.getElementById("root");
if (!r) { root.innerHTML = `<div class="wrap empty" style="padding-block:80px"><h1 class="h2">${L("لم نجد هذه المنطقة", "Area not found")}</h1><a class="btn btn-forest" href="explore.html">${L("كل المناطق", "All areas")}</a></div>`; return; }
document.title = "Bali Trips — " + t(r.name);
const acts = D.ACTIVITIES.filter(a => a.region === r.id), places = D.PLACES.filter(p => p.region === r.id), food = places.filter(p => p.cat === "restaurants" || p.cat === "cafes"), its = D.ITINERARIES.filter(i => i.regions.includes(r.id));
root.innerHTML = `<section class="banner"><img class="bg" src="${r.img}" alt=""><div class="wrap">${BT.crumbs([[L("الرئيسية", "Home"), "home.html"], [L("استكشف بالي", "Explore Bali"), "explore.html"], [t(r.name), "#"]]).replace('class="crumbs"', 'class="crumbs on-dark"')}<span class="eyebrow" style="color:var(--palm)">${t(r.tag)}</span><h1>${t(r.name)}</h1><p>${t(r.about)}</p></div></section>
<section class="sec-tight"><div class="wrap stack" style="gap:24px">
  <div class="facts3"><div><small class="muted">${L("مدة مقترحة", "Suggested stay")}</small><b>${t(r.best)}</b></div><div><small class="muted">${L("أنشطة قابلة للحجز", "Bookable activities")}</small><b class="num">${acts.length}</b></div><div><small class="muted">${L("أماكن مختارة", "Picked places")}</small><b class="num">${places.length}</b></div><div><small class="muted">${L("معلومة مفيدة", "Good to know")}</small><b>${L("الطرق تزدحم بعد الظهر — ابدأ مبكرًا", "Roads get busy after noon — start early")}</b></div></div>
  <a class="rmap" href="map.html#region-${r.id}" aria-label="${L("افتح المنطقة على الخريطة", "Open this area on the map")}"><img src="assets/img/bali-sat.jpg" alt="" id="ri">${places.map(p => `<span class="pt" data-x="${p.x}" data-y="${p.y}"></span>`).join("")}<span class="btn btn-light btn-sm">${icon("map", 16)} ${L("افتحها على الخريطة", "Open on the map")}</span></a>
</div></section>
${acts.length ? `<section class="sec-tight"><div class="wrap stack" style="gap:18px"><div class="row between"><h2 class="h2">${L("أفضل الأنشطة هنا", "Top activities here")}</h2><a class="btn btn-ghost btn-sm" href="activities.html">${L("كل الأنشطة", "All activities")}</a></div><div class="grid g3" id="acts"></div></div></section>` : ""}
<section class="sec-tight bg-ivory2"><div class="wrap stack" style="gap:18px"><h2 class="h2">${L("مطاعم وكافيهات مختارة", "Picked restaurants & cafés")}</h2><div class="grid g4" id="food"></div></div></section>
<section class="sec-tight"><div class="wrap stack" style="gap:18px"><h2 class="h2">${L("جداول تشمل المنطقة", "Itineraries that include it")}</h2><div class="grid g4" id="its"></div>
<div class="panel row between" style="gap:14px"><b style="color:var(--forest)">${L("خدمات مرتبطة", "Related services")}</b><div class="row"><a class="btn btn-ghost btn-sm" href="custom-trip.html">${L("رحلة مخصصة", "Custom trip")}</a></div></div></div></section>`;
const ri = document.getElementById("ri"), box = ri.parentElement, s = 1.1;
const pos = () => { const ox = box.clientWidth / 2 - r.x * s, oy = box.clientHeight / 2 - r.y * s; ri.style.width = 2048 * s + "px"; ri.style.height = 1399 * s + "px"; ri.style.left = ox + "px"; ri.style.top = oy + "px"; box.querySelectorAll(".pt").forEach(p => { p.style.left = (ox + p.dataset.x * s) + "px"; p.style.top = (oy + p.dataset.y * s) + "px"; }); };
pos(); addEventListener("resize", pos);
mount("#acts", acts.map(BT.activityCard).join(""));
mount("#food", (food.length ? food : places.slice(0, 4)).map(BT.placeCard).join(""));
mount("#its", (its.length ? its : D.ITINERARIES.slice(0, 2)).map(BT.itineraryCard).join(""));
})();
</script>
</body>
</html>
