function drawer(html) { const d = document.getElementById("drw"), s = document.getElementById("scrim"); d.innerHTML = html; trDom(d); d.classList.add("open"); s.classList.add("open"); s.onclick = close; d.querySelector("[data-close]")?.addEventListener("click", close); function close() { d.classList.remove("open"); s.classList.remove("open"); } return close; }

  <div class="field"><label for="nt">ملاحظة داخلية / رسالة للعميل</label><textarea class="textarea" id="nt" placeholder="مثال: نقطة اللقاء، رقم المرشد…"></textarea></div>
  <label class="check"><input type="checkbox" checked><span>إشعار العميل بالبريد وواتساب</span></label>
  <div class="box"><b style="color:var(--forest)">السجل</b><ol class="tl-list" style="font-size:13.5px"><li><b>أُنشئ الطلب</b><br><small class="muted">اليوم ٠٩:١٢</small></li><li><b>تم الدفع</b><br><small class="muted">اليوم ٠٩:١٤</small></li><li class="now"><b>أُرسل للمزود</b><br><small class="muted">اليوم ٠٩:١٥ — بانتظار الرد</small></li></ol></div>
  <div class="row"><button class="btn btn-primary" id="sv">حفظ وإشعار العميل</button><button class="btn btn-ghost" data-close>إلغاء</button></div>`);
  document.getElementById("sv").onclick = () => { const v = document.getElementById("ns").value; b[5] = v; close(); toast("حُدّثت الحالة وأُشعر العميل"); route(); }; }
let filt = "all";
function route() {
  const h = decodeURIComponent(location.hash.slice(1) || "overview"); const [k, a] = h.split("/");
  const sect = V[k] ? k : "overview"; const navK = sect === "editor" ? "activities" : sect;
  document.getElementById("sb").innerHTML = `<div class="lg"><img src="assets/logo-light.png" alt="Bali Trips" style="height:30px;width:auto"><span>Admin</span></div>` + NAV.map(([g, items]) => `<div class="grp">${g}</div>` + items.map(([k2, i, n, c]) => `<a href="#${k2}" ${k2 === navK ? 'aria-current="page"' : ""} class="${can(k2) ? "" : "locked"}">${ic(can(k2) ? i : "lock")} ${n}${c && can(k2) ? `<span class="ct">${c}</span>` : ""}</a>`).join("")).join("") + `<a href="index.html" style="margin-top:auto">${ic("doc")} صفحة المشروع</a>`;

function mapMgr() {

    <div class="field"><label for="pc">التصنيف</label><select class="select" id="pc">${D.CATS.map(c => `<option ${c.id === p.cat ? "selected" : ""}>${t(c.name)}</option>`).join("")}</select></div>
    <div class="field"><label for="pr">المنطقة</label><select class="select" id="pr">${D.REGIONS.map(r => `<option ${r.id === p.region ? "selected" : ""}>${t(r.name)}</option>`).join("")}</select></div>
    <div class="field"><label for="pa">ربط بفعالية / خدمة</label><select class="select" id="pa"><option>بدون</option>${D.ACTIVITIES.map(a => `<option ${a.id === p.activity ? "selected" : ""}>${t(a.title)}</option>`).join("")}</select></div>
    <div class="field"><label for="pd">النبذة</label><textarea class="textarea" id="pd">${p.isNew ? "" : t(p.desc)}</textarea></div>
    <div class="thumbs">${p.isNew ? "" : `<img src="${img(p.img)}" alt="">`}<span class="up" style="width:76px;height:76px;padding:0;justify-content:center">${ic("plus")}</span></div>
    <label class="check"><input type="checkbox" ${!p.isNew && inFreeA(p) ? "checked" : ""}><span>ضمن المنطقة المجانية</span></label>
    <div class="row"><button class="btn btn-primary btn-sm" id="psave">${p.isNew ? "حفظ كمسودة" : "حفظ"}</button>${p.isNew ? "" : '<button class="btn btn-ghost btn-sm" style="color:var(--err)">إخفاء من الخريطة</button>'}</div>`;
    trDom(f);
    document.getElementById("psave").onclick = () => { p.draft = true; p.isNew = false; if (!p.name.ar) p.name = { ar: document.getElementById("pn").value || "مكان جديد", en: "" }; draw(); toast("حُفظت النقطة كمسودة — تظهر بعد النشر"); }; };
  const inFreeA = (p) => { const z = D.FREE_ZONE; let c = false; for (let i = 0, j = z.length - 1; i < z.length; j = i++) { if (((z[i][1] > p.y) !== (z[j][1] > p.y)) && (p.x < (z[j][0] - z[i][0]) * (p.y - z[i][1]) / (z[j][1] - z[i][1]) + z[i][0])) c = !c; } return c; };
  mm.onclick = (e) => { const r = mm.getBoundingClientRect(); const x = (e.clientX - r.left - ox) / s, y = (e.clientY - r.top - oy) / s; window._newPts = (window._newPts || []).filter(p => !p.isNew); const p = { id: "new" + Date.now(), x, y, isNew: true, name: { ar: "", en: "" }, cat: "restaurants", region: "ubud" }; window._newPts.push(p); draw(); form(p); };
