<!--title: Bali Trips — حسابي|page: account|section: account|scripts: booking-->
<style>
.acc-l { display: grid; gap: 24px; align-items: start; padding-block: 8px 72px; }
@media (min-width: 1024px) { .acc-l { grid-template-columns: 260px minmax(0,1fr); gap: 40px; } }
.anav { position: sticky; top: calc(var(--hdr-h) + 16px); display: flex; flex-direction: column; gap: 2px; padding: 10px; }
.anav a { display: flex; align-items: center; gap: 10px; padding: 11px 12px; border-radius: 12px; font-weight: 600; color: var(--forest-soft); font-size: 14.5px; }
.anav a:hover { background: var(--ivory-2); }
.anav a[aria-current="page"] { background: var(--forest); color: #fff; }
.anav .ct { margin-inline-start: auto; font: 700 11px var(--f-en); background: var(--orange); color: var(--forest-ink); border-radius: 99px; padding: 1px 7px; }
@media (max-width: 1023px) { .anav { position: static; flex-direction: row; overflow-x: auto; padding: 6px; } .anav a { white-space: nowrap; } }
.who { display: flex; gap: 14px; align-items: center; padding: 18px; border-radius: 20px; background: var(--forest); color: rgba(255,255,255,.86); }
.who .av { width: 54px; height: 54px; border-radius: 50%; background: var(--palm); color: var(--forest-ink); display: grid; place-items: center; font: 800 22px var(--f); }
.who b { color: #fff; font-size: 18px; }
.ov { display: grid; gap: 12px; grid-template-columns: repeat(auto-fit, minmax(min(100%, 200px), 1fr)); }
.ov a { padding: 16px; border-radius: 18px; background: var(--white); border: 1px solid var(--line-soft); display: flex; flex-direction: column; gap: 4px; }
.ov b { font: 800 26px var(--f-en); color: var(--forest); }
.bk-row { display: grid; grid-template-columns: 72px minmax(0,1fr) auto; gap: 14px; align-items: center; padding: 12px; border-radius: 18px; background: var(--white); border: 1px solid var(--line-soft); }
.bk-row img { width: 72px; height: 72px; border-radius: 14px; object-fit: cover; }
.bk-row:hover { border-color: var(--palm-mid); }
.kv { display: grid; gap: 8px; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); }
.kv div { padding: 12px 14px; border-radius: 14px; background: var(--ivory-2); }
.kv small { color: var(--muted); display: block; } .kv b { color: var(--forest); }
.notif { display: grid; grid-template-columns: 40px minmax(0,1fr) auto; gap: 12px; align-items: start; padding: 14px; border-radius: 16px; background: var(--white); border: 1px solid var(--line-soft); }
.notif.unread { border-color: var(--orange); background: #FFFCF6; }
.notif .ic { width: 40px; height: 40px; border-radius: 12px; display: grid; place-items: center; background: var(--palm-soft); color: var(--forest); }
.guest { text-align: center; }
</style>
<main id="main"><div class="wrap"><div id="crumbs"></div><div class="acc-l"><nav class="panel anav" id="anav" aria-label="أقسام الحساب" data-en-aria="Account sections"></nav><div id="view" class="stack minw0" style="gap:22px" aria-live="polite"></div></div></div></main>
<div class="modal-scrim" id="mdl" role="dialog" aria-modal="true"><div class="modal stack" style="gap:14px" id="mdl-b"></div></div>
<script>
BT.boot();
(function () {
const { D, t, L, icon, img, money, numAr, esc, Fav, Auth, toast, byId } = BT;
const user = Auth.user();
let orders = BT.store.get("orders", []);
const demo = !orders.length;
if (demo) { const d = (n) => { const x = new Date(); x.setDate(x.getDate() + n); return BT.iso(x); };
  orders = [{ id: "BT-2026-1042", demo: true, date: new Date().toISOString(), state: "success", total: 276, items: [{ type: "activity", ref: "water-sports", title: D.ACTIVITIES[0].title, img: "penida-cove", date: d(9), time: "09:00", people: 2, total: 276, lines: [{ l: { ar: "الباقة الشاملة × 2", en: "All-in × 2" }, v: 158 }, { l: { ar: "تصوير فوتوغرافي", en: "Photos" }, v: 25 }, { l: { ar: "جولة إضافية", en: "Extra round" }, v: 38 }], status: "confirmed" }] },
    { id: "BT-2026-0977", demo: true, date: new Date().toISOString(), state: "success", total: 59, items: [{ type: "itinerary", ref: "5-days", title: D.ITINERARIES[1].name, img: "rice-walk", total: 59, lines: [] }] },
    { id: "BT-2026-0950", demo: true, date: new Date().toISOString(), state: "success", total: 165, items: [{ type: "activity", ref: "batur-sunrise", title: { ar: "صعود جبل باتور لشروق الشمس", en: "Mount Batur sunrise hike" }, img: "aerial-cliff", date: d(10), time: "03:30", people: 2, total: 165, lines: [], status: "pending" }] }]; }
const allItems = orders.flatMap(o => o.items.map(i => Object.assign({ order: o.id, ostate: o.state }, i)));
const bookings = allItems.filter(i => i.type !== "itinerary" && i.type !== "map");
const files = allItems.filter(i => i.type === "itinerary" || i.type === "map");
const custom = BT.store.get("customReqs", []);
const statusOf = (i) => i.ostate === "failed" ? ["err", L("الدفع مرفوض", "Payment declined")] : i.ostate === "processing" ? ["info", L("الدفع قيد المعالجة", "Processing")] : i.ostate === "transfer" ? ["forest", L("بانتظار الحوالة", "Awaiting transfer")] : i.status === "confirmed" ? ["ok", L("مؤكد", "Confirmed")] : i.status === "cancelled" ? ["err", L("ملغى", "Cancelled")] : ["warn", L("بانتظار تأكيد المزود", "Awaiting provider")];
const notifs = [[1, "check", L("تأكد حجز «الرياضات المائية في نوسا دوا» من المزود.", "Your Nusa Dua water sports booking was confirmed."), L("قبل ساعة", "1h ago")], [1, "clock", L("تفاصيل نقطة اللقاء ستصلك قبل الموعد بـ ٢٤ ساعة.", "Meeting-point details arrive 24h before."), L("اليوم", "Today")], [0, "doc", L("جدول ٥ أيام جاهز للتحميل.", "Your 5-day itinerary is ready to download."), L("أمس", "Yesterday")], [0, "sparkle", L("أماكن جديدة أُضيفت إلى خريطة أوبود.", "New places were added to the Ubud map."), L("منذ ٣ أيام", "3 days ago")]];
const SECT = [["overview", "home", L("نظرة عامة", "Overview")], ["bookings", "cal", L("حجوزاتي", "My bookings"), bookings.length], ["files", "doc", L("جداولي وملفاتي", "My itineraries & files"), files.length], ["custom", "wand", L("طلبات الرحلات المخصصة", "Custom trip requests"), custom.length], ["favorites", "heart", L("المفضلة", "Favorites"), Fav.all().length], ["notifications", "bell", L("الإشعارات", "Notifications"), 2], ["profile", "user", L("الملف الشخصي", "Profile")], ["support", "chat", L("الدعم والمساعدة", "Support")], ["settings", "settings", L("الإعدادات", "Settings")]];
function nav(cur) { document.getElementById("anav").innerHTML = SECT.map(([k, i, n, c]) => `<a href="#${k}" ${k === cur ? 'aria-current="page"' : ""}>${icon(i, 18)} ${n}${c ? `<span class="ct">${c}</span>` : ""}</a>`).join("") + (user ? `<a href="#" id="lo">${icon("logout", 18)} ${L("تسجيل الخروج", "Log out")}</a>` : ""); const lo = document.getElementById("lo"); if (lo) lo.onclick = (e) => { e.preventDefault(); Auth.logout(); location.href = "home.html"; }; }
const bkRow = (i) => { const [c, s] = statusOf(i); return `<a class="bk-row" href="#booking/${i.order}/${i.ref}"><img src="${img(i.img)}" alt=""><span class="minw0"><b style="color:var(--forest)">${esc(t(i.title))}</b><br><small class="muted">${i.date ? BT.fmtDate(i.date) + (i.dateEnd ? " – " + BT.fmtDate(i.dateEnd) : "") + (i.time ? " · " + i.time : "") : ""} · <span class="num">${i.order}</span></small><br><span class="tag tag-${c}" style="margin-top:4px">${s}</span></span><span class="stack" style="align-items:flex-end;gap:4px"><b class="price" style="color:var(--forest)">${money(i.total)}</b><span class="flip">${icon("chev", 18)}</span></span></a>`; };
const V = {
  overview: () => `<div class="who"><span class="av">${esc((user ? user.name : "؟").slice(0, 1).toUpperCase())}</span><span><b>${user ? L("مرحبًا، ", "Hi, ") + esc(user.name) : L("أهلًا بك", "Welcome")}</b><br><small>${user ? esc(user.email) : L("سجّل الدخول لترى حجوزاتك", "Log in to see your bookings")}</small></span></div>
    ${demo ? `<div class="alert alert-info">${icon("info", 18)}<span>${L("تعرض هذه الصفحة حجوزات تجريبية. أكمل حجزًا في النموذج لترى بياناتك هنا.", "This page shows sample bookings. Complete a booking in the prototype to see your own here.")}</span></div>` : ""}
    <div class="ov"><a href="#bookings"><small class="muted">${L("حجوزات قادمة", "Upcoming bookings")}</small><b>${bookings.length}</b></a><a href="#files"><small class="muted">${L("جداول وملفات", "Itineraries & files")}</small><b>${files.length}</b></a><a href="#favorites"><small class="muted">${L("في المفضلة", "Favorites")}</small><b>${Fav.all().length}</b></a><a href="my-trip.html"><small class="muted">${L("في رحلتي", "In My Trip")}</small><b>${BT.Trip.count()}</b></a></div>
    <div class="stack" style="gap:10px"><div class="row between"><h2 class="h3">${L("الحجز القادم", "Next booking")}</h2><a class="link" href="#bookings">${L("كل الحجوزات", "All bookings")}</a></div>${bookings[0] ? bkRow(bookings[0]) : `<div class="panel empty">${L("لا حجوزات بعد", "No bookings yet")}</div>`}</div>`,
  bookings: () => `<h1 class="h2">${L("حجوزاتي", "My bookings")}</h1><div class="seg" role="group"><button aria-pressed="true">${L("القادمة", "Upcoming")}</button><button aria-pressed="false" onclick="BT.toast('${L("لا توجد حجوزات سابقة بعد", "No past bookings yet")}')">${L("السابقة", "Past")}</button></div>${bookings.length ? bookings.map(bkRow).join("") : `<div class="panel empty"><span class="ill">${icon("cal", 34)}</span><b style="color:var(--forest)">${L("لا حجوزات بعد", "No bookings yet")}</b><a class="btn btn-primary btn-sm" href="activities.html">${L("ابحث عن نشاط", "Find an activity")}</a></div>`}`,
  files: () => `<h1 class="h2">${L("جداولي وملفاتي", "My itineraries & files")}</h1>${files.length ? files.map(i => `<div class="bk-row"><img src="${img(i.img)}" alt=""><span class="minw0"><b style="color:var(--forest)">${esc(t(i.title))}</b><br><small class="muted">${i.type === "map" ? L("وصول كامل للخريطة", "Full map access") : L("PDF · التحميلات المتبقية: ٤ من ٥", "PDF · 4 of 5 downloads left")}</small></span>${i.type === "map" ? `<a class="btn btn-forest btn-sm" href="map.html">${L("افتح الخريطة", "Open map")}</a>` : `<button class="btn btn-forest btn-sm" data-dl>${icon("download", 16)} ${L("تحميل", "Download")}</button>`}</div>`).join("") : `<div class="panel empty"><span class="ill">${icon("doc", 34)}</span><b style="color:var(--forest)">${L("لم تشترِ جداول بعد", "No itineraries yet")}</b><a class="btn btn-primary btn-sm" href="itineraries.html">${L("تصفح الجداول", "Browse itineraries")}</a></div>`}`,
  custom: () => `<h1 class="h2">${L("طلبات الرحلات المخصصة", "Custom trip requests")}</h1>${custom.length ? custom.map(c => `<div class="panel stack" style="gap:10px"><div class="row between"><b style="color:var(--forest)">${c.id}</b><span class="tag tag-warn">${L("قيد التصميم", "Being designed")}</span></div><small class="muted">${c.data.flexible ? L(`مرنة — حوالي ${numAr(c.data.days)} أيام`, `Flexible — ~${c.data.days} days`) : `${BT.fmtDate(c.data.a)} – ${BT.fmtDate(c.data.b)}`} · ${numAr(c.data.adults)} ${L("بالغين", "adults")} · $${c.data.budget.toLocaleString("en-US")}</small><ol class="tl-list" style="font-size:14px"><li><b>${L("استلمنا الطلب", "Request received")}</b></li><li class="now"><b>${L("يصمم الفريق خطتك", "Team is designing your plan")}</b></li><li class="pending"><b>${L("عرض السعر", "Quote")}</b></li><li class="pending"><b>${L("الموافقة والدفع", "Approve & pay")}</b></li></ol></div>`).join("") : `<div class="panel empty"><span class="ill">${icon("wand", 34)}</span><b style="color:var(--forest)">${L("لا توجد طلبات", "No requests")}</b><a class="btn btn-primary btn-sm" href="custom-trip.html">${L("اطلب رحلة مخصصة", "Request a custom trip")}</a></div>`}`,
  favorites: () => { const f = Fav.all(); const map = { act: [D.ACTIVITIES, BT.activityCard], plc: [D.PLACES, BT.placeCard], iti: [D.ITINERARIES, BT.itineraryCard], pkg: [D.PACKAGES, BT.packageCard] };
    const cards = f.map(k => { const [p, id] = k.split(":"); const m = map[p]; const o = m && byId(m[0], id); return o ? m[1](o) : ""; }).join("");
    return `<h1 class="h2">${L("المفضلة", "Favorites")}</h1>${!user ? `<div class="alert alert-info">${icon("info", 18)}<span>${L("مفضلتك محفوظة على هذا الجهاز. سجّل الدخول لنقلها إلى حسابك.", "Your favorites are saved on this device. Log in to keep them in your account.")} <a class="link" href="login.html">${L("تسجيل الدخول", "Log in")}</a></span></div>` : ""}${cards ? `<div class="grid g2">${cards}</div>` : `<div class="panel empty"><span class="ill">${icon("heart", 34)}</span><b style="color:var(--forest)">${L("لم تحفظ شيئًا بعد", "Nothing saved yet")}</b><p class="muted">${L("اضغط على القلب في أي نشاط أو مكان أو جدول.", "Tap the heart on any activity, place or itinerary.")}</p><a class="btn btn-primary btn-sm" href="map.html">${L("استكشف الخريطة", "Explore the map")}</a></div>`}`; },
  notifications: () => `<div class="row between"><h1 class="h2">${L("الإشعارات", "Notifications")}</h1><button class="btn btn-ghost btn-sm" id="mark">${L("تحديد الكل كمقروء", "Mark all read")}</button></div>${notifs.map(([u, i, m, w]) => `<div class="notif ${u ? "unread" : ""}"><span class="ic">${icon(i, 20)}</span><span>${m}</span><small class="muted">${w}</small></div>`).join("")}`,
  profile: () => `<h1 class="h2">${L("الملف الشخصي", "Profile")}</h1><form class="panel stack" id="pf" novalidate style="gap:14px"><div class="grid g2" style="gap:14px"><div class="field"><label for="p1">${L("الاسم", "Name")}</label><input class="input" id="p1" value="${esc(user ? user.name : "")}"></div><div class="field"><label for="p2">${L("البريد", "Email")}</label><input class="input" id="p2" dir="ltr" value="${esc(user ? user.email : "")}"></div><div class="field"><label for="p3">${L("واتساب", "WhatsApp")}</label><input class="input" id="p3" dir="ltr" placeholder="+966"></div><div class="field"><label for="p4">${L("الجنسية (اختياري)", "Nationality (optional)")}</label><input class="input" id="p4"></div></div><button class="btn btn-primary" style="align-self:flex-start">${L("حفظ", "Save")}</button></form>`,
  support: () => `<h1 class="h2">${L("الدعم والمساعدة", "Support")}</h1><div class="grid g2"><a class="panel stack" href="help.html"><b style="color:var(--forest)">${L("مركز المساعدة", "Help center")}</b><span class="muted">${L("إجابات عن الحجز والدفع والخريطة", "Answers on booking, payment and the map")}</span></a><a class="panel stack" href="contact.html"><b style="color:var(--forest)">${L("تواصل مع الفريق", "Contact the team")}</b><span class="muted">${L("واتساب والبريد يوميًا", "WhatsApp and email, daily")}</span></a></div>`,
  settings: () => `<h1 class="h2">${L("الإعدادات", "Settings")}</h1><div class="panel stack" style="gap:16px"><div class="field"><span class="label">${L("اللغة", "Language")}</span><div class="seg" role="group"><button data-lang="ar" aria-pressed="${BT.LANG === "ar"}">العربية</button><button data-lang="en" aria-pressed="${BT.LANG === "en"}">English</button><button data-lang="id" aria-pressed="false">Indonesia</button></div></div><div class="field"><span class="label">${L("التواصل المفضل", "Preferred contact")}</span><div class="chips"><button class="chip" aria-pressed="true">WhatsApp</button><button class="chip" aria-pressed="true">${L("البريد", "Email")}</button><button class="chip" aria-pressed="false">SMS</button></div></div><div class="field"><label for="cur">${L("العملة", "Currency")}</label><select class="select" id="cur" style="max-width:240px"><option>USD $</option><option>SAR ر.س</option><option>AED د.إ</option><option>IDR Rp</option></select><span class="hint">${L("عرض تقريبي — الدفع بعملة البوابة المعتمدة.", "Approximate display — payment uses the gateway currency.")}</span></div><hr style="border:0;border-top:1px solid var(--line)"><button class="btn btn-ghost btn-sm" id="del" style="align-self:flex-start;color:var(--err)">${L("حذف الحساب", "Delete account")}</button></div>`,
  booking: (oid, ref) => { const i = allItems.find(x => x.order === oid && x.ref === ref); if (!i) return `<div class="panel empty">${L("لم نجد الحجز", "Booking not found")}</div>`; const [c, s] = statusOf(i); const conf = i.status === "confirmed";
    return `<a class="link" href="#bookings" style="align-self:flex-start">${L("رجوع لحجوزاتي", "Back to bookings")}</a><div class="row between"><h1 class="h2">${esc(t(i.title))}</h1><span class="tag tag-${c}">${s}</span></div>
    <div class="kv"><div><small>${L("رقم الحجز", "Booking no.")}</small><b class="num">${oid}</b></div><div><small>${L("التاريخ", "Date")}</small><b>${i.date ? BT.fmtDate(i.date) + (i.dateEnd ? " – " + BT.fmtDate(i.dateEnd) : "") : "—"}</b></div><div><small>${L("الوقت", "Time")}</small><b class="num">${i.time || "—"}</b></div><div><small>${L("المشاركون", "Travelers")}</small><b>${i.people ? numAr(i.people) : "—"}</b></div></div>
    <div class="panel stack" style="gap:6px"><b style="color:var(--forest)">${L("الباقة والإضافات", "Package & extras")}</b>${(i.lines || []).map(l => `<div class="sum-row"><span>${t(l.l)}</span><span class="price">${money(l.v)}</span></div>`).join("")}<div class="sum-total"><span>${L("المبلغ المدفوع", "Amount paid")}</span><b class="price">${money(i.total)}</b></div></div>
    <div class="panel stack"><b style="color:var(--forest)">${L("سجل الحالة", "Status timeline")}</b><ol class="tl-list"><li><b>${L("تم الدفع", "Paid")}</b><br><small class="muted">${BT.fmtDate(BT.iso(new Date()))}</small></li><li class="${conf ? "" : "now"}"><b>${L("تأكيد المزود", "Provider confirmation")}</b><br><small class="muted">${conf ? L("تم التأكيد", "Confirmed") : L("بانتظار الرد — عادةً خلال ٢٤ ساعة", "Waiting — usually within 24h")}</small></li><li class="${conf ? "now" : "pending"}"><b>${L("القسيمة ومعلومات التواصل", "Voucher & contact info")}</b><br><small class="muted">${conf ? L("متاحة الآن", "Available now") : L("بعد التأكيد", "After confirmation")}</small></li></ol></div>
    ${conf ? `<div class="panel stack" style="gap:8px"><b style="color:var(--forest)">${L("القسيمة ونقطة الالتقاء", "Voucher & meeting point")}</b><span class="muted">${L("نقطة الالتقاء: بهو فندقك الساعة ٠٨:٣٠. رقم المزود يظهر هنا بعد التأكيد.", "Meeting point: your hotel lobby at 08:30. The provider's number appears here after confirmation.")}</span><button class="btn btn-forest btn-sm" data-dl style="align-self:flex-start">${icon("download", 16)} ${L("تحميل القسيمة", "Download voucher")}</button></div>` : ""}
    <div class="row"><a class="btn btn-ghost btn-sm" href="contact.html">${icon("chat", 16)} ${L("تواصل بخصوص الحجز", "Contact about this booking")}</a><button class="btn btn-ghost btn-sm" id="cancel" style="color:var(--err)">${L("طلب إلغاء", "Request cancellation")}</button></div>`; },
};
function render() {
  const h = decodeURIComponent(location.hash.slice(1) || "overview"); const [k, a, b] = h.split("/");
  const sect = V[k] ? k : "overview";
  document.getElementById("crumbs").innerHTML = BT.crumbs([[L("الرئيسية", "Home"), "home.html"], [L("حسابي", "My account"), "account.html"], [(SECT.find(s => s[0] === (sect === "booking" ? "bookings" : sect)) || [, , ""])[2], "#"]]);
  nav(sect === "booking" ? "bookings" : sect);
  const v = document.getElementById("view");
  if (!user && !["favorites", "overview", "settings"].includes(sect)) { v.innerHTML = `<div class="panel empty guest"><span class="ill">${icon("user", 36)}</span><h1 class="h3">${L("سجّل الدخول للمتابعة", "Log in to continue")}</h1><p class="muted">${L("حجوزاتك وملفاتك محفوظة في حسابك.", "Your bookings and files live in your account.")}</p><div class="row" style="justify-content:center"><a class="btn btn-primary" href="login.html">${L("تسجيل الدخول", "Log in")}</a><a class="btn btn-ghost" href="register.html">${L("إنشاء حساب", "Create account")}</a></div><small class="muted">${L("في النموذج: الحجوزات التجريبية تظهر بعد الدخول.", "Prototype: sample bookings show after logging in.")}</small></div>`; return; }
  v.innerHTML = sect === "booking" ? V.booking(a, b) : V[sect]();
  v.querySelectorAll("[data-dl]").forEach(x => x.onclick = () => toast(L("في النسخة الفعلية يبدأ التحميل هنا", "In production the download starts here")));
  const m = document.getElementById("mark"); if (m) m.onclick = () => { v.querySelectorAll(".unread").forEach(n => n.classList.remove("unread")); toast(L("تم تحديد الكل كمقروء", "All marked as read")); };
  const pf = document.getElementById("pf"); if (pf) pf.onsubmit = (e) => { e.preventDefault(); Auth.login({ name: document.getElementById("p1").value, email: document.getElementById("p2").value }); toast(L("حُفظت بياناتك", "Profile saved")); };
  v.querySelectorAll("[data-lang]").forEach(x => x.onclick = () => BT.setLang(x.dataset.lang));
  const cn = document.getElementById("cancel"); if (cn) cn.onclick = () => modal(L("طلب إلغاء الحجز؟", "Request cancellation?"), L("حسب سياسة المزود: إلغاء مجاني حتى ٤٨ ساعة قبل الموعد. سيصلك تأكيد الإلغاء والمبلغ المسترد قبل التنفيذ.", "Per the provider policy: free up to 48h before. You'll see the refund amount before anything is final."), L("أرسل طلب الإلغاء", "Send request"), () => toast(L("أُرسل طلب الإلغاء", "Cancellation request sent")));
  const dl = document.getElementById("del"); if (dl) dl.onclick = () => modal(L("حذف الحساب نهائيًا؟", "Delete account permanently?"), L("ستُحذف بياناتك وملفاتك. الحجوزات القادمة تبقى سارية لدى المزودين.", "Your data and files will be deleted. Upcoming bookings stay valid with providers."), L("حذف الحساب", "Delete account"), () => { Auth.logout(); location.href = "home.html"; });
  scrollTo({ top: 0 });
}
const mdl = document.getElementById("mdl");
function modal(h, p, yes, fn) { document.getElementById("mdl-b").innerHTML = `<h2 class="h3">${h}</h2><p class="muted">${p}</p><div class="row"><button class="btn btn-forest" id="my">${yes}</button><button class="btn btn-ghost" id="mn">${L("تراجع", "Cancel")}</button></div>`; mdl.classList.add("open"); document.getElementById("mn").focus(); document.getElementById("my").onclick = () => { mdl.classList.remove("open"); fn(); }; document.getElementById("mn").onclick = () => mdl.classList.remove("open"); }
addEventListener("hashchange", render); render();
})();
</script>
