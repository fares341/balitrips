<style>
.hh { background: var(--forest); color: rgba(255,255,255,.86); position: relative; overflow: hidden; }
.hh .wrap { padding-block: 16px 48px; display: flex; flex-direction: column; gap: 16px; align-items: center; text-align: center; position: relative; z-index: 1; }
.hh h1 { color: #fff; }
.hh .arc { width: 600px; height: 600px; inset-inline-start: -260px; top: -360px; opacity: .3; }
.hs { width: min(100%, 620px); display: flex; align-items: center; gap: 8px; padding: 6px 6px 6px 18px; border-radius: 99px; background: #fff; }
[dir="rtl"] .hs { padding: 6px 18px 6px 6px; }
.hs input { flex: 1; min-width: 0; border: 0; outline: 0; min-height: 44px; color: var(--ink); background: transparent; }
.topics { display: grid; gap: 14px; grid-template-columns: repeat(auto-fill, minmax(min(100%, 260px), 1fr)); }
.topics a { display: flex; flex-direction: column; gap: 8px; padding: 20px; border-radius: 20px; background: var(--white); border: 1px solid var(--line-soft); box-shadow: var(--sh-1); transition: transform var(--d-base) var(--ease); }
.topics a:hover { transform: translateY(-3px); }
.topics .ic { width: 46px; height: 46px; border-radius: 14px; background: var(--palm-soft); color: var(--forest); display: grid; place-items: center; }
.topics b { color: var(--forest); font-size: 17px; }
</style>
<main id="main">
  <section class="hh"><div class="arc" aria-hidden="true"></div><div class="wrap"><div id="crumbs" style="align-self:stretch"></div><h1 class="h1" data-en="How can we help?">كيف نساعدك؟</h1>
    <form class="hs" action="faq.html" id="hs"><input id="hq" placeholder="ابحث: إلغاء، دفع، سائق…" data-en-ph="Search: cancel, payment, driver…" aria-label="بحث" data-en-aria="Search"><button class="btn btn-primary btn-sm" data-en="Search">بحث</button></form></div></section>
  <section class="sec"><div class="wrap stack" style="gap:24px"><div class="topics" id="topics"></div>
    <div class="grid g2"><div class="panel stack"><b style="color:var(--forest)" data-en="Track a booking">تتبع حجزًا</b><span class="muted" data-en="See the live status of every booking in your account.">شاهد حالة كل حجز في حسابك.</span><a class="btn btn-forest btn-sm" href="account.html#bookings" style="align-self:flex-start" data-en="My bookings">حجوزاتي</a></div>
    <div class="panel stack"><b style="color:var(--forest)" data-en="Talk to a person">تحدث مع شخص</b><span class="muted" data-en="WhatsApp and email, daily.">واتساب والبريد، يوميًا.</span><a class="btn btn-ghost btn-sm" href="contact.html" style="align-self:flex-start" data-en="Contact us">تواصل معنا</a></div></div></div></section>
</main>
<script>
BT.boot();
(function () {
const { L, icon } = BT;
document.getElementById("crumbs").outerHTML = BT.crumbs([[L("الرئيسية", "Home"), "home.html"], [L("مركز المساعدة", "Help center"), "#"]]).replace('class="crumbs"', 'class="crumbs on-dark"');
BT.mount("#topics", [["cal", L("الحجوزات", "Bookings"), L("التأكيد، التعديل، القسيمة", "Confirmation, changes, voucher"), "faq.html"], ["card", L("الدفع والاسترداد", "Payments & refunds"), L("الطرق، الفشل، الاسترداد", "Methods, failures, refunds"), "policy.html#cancellation"], ["map", L("الخريطة التفاعلية", "Interactive map"), L("المجانية والكاملة، الموقع", "Free vs full, location"), "policy.html#map"], ["doc", L("الجداول والملفات", "Itineraries & files"), L("التحميل وإعادة التحميل", "Downloading again"), "account.html#files"], ["car", L("السائق", "Driver"), L("الأيام، السيارة، التواصل", "Days, car, contact"), "driver.html"], ["user", L("الحساب", "Account"), L("الدخول، كلمة المرور، اللغة", "Login, password, language"), "account.html#settings"]].map(([i, t, d, h]) => `<a href="${h}"><span class="ic">${icon(i, 22)}</span><b>${t}</b><span class="muted">${d}</span></a>`).join(""));
})();
</script>
